<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Bill Splitter</h1>
      <p class="app-subtitle">Split the check, keep it fair</p>
    </header>

    <!-- Mode Switcher (f6) -->
    <nav class="mode-switcher" role="tablist" aria-label="Split mode">
      <button class="mode-btn active" role="tab" aria-selected="true" data-mode="equal">Equal</button>
      <button class="mode-btn" role="tab" aria-selected="false" data-mode="itemized">Itemized</button>
      <button class="mode-btn" role="tab" aria-selected="false" data-mode="custom">Custom</button>
    </nav>

    <!-- Tip Calculator (f4) -->
    <section class="tip-section card">
      <h2 class="section-title">Tip</h2>
      <div class="tip-presets">
        <button class="tip-preset" data-tip="15">15%</button>
        <button class="tip-preset active" data-tip="18">18%</button>
        <button class="tip-preset" data-tip="20">20%</button>
        <button class="tip-preset" data-tip="25">25%</button>
      </div>
      <div class="tip-custom-row">
        <label for="tip-custom">Custom tip %</label>
        <input type="number" id="tip-custom" min="0" max="100" step="0.5" placeholder="18">
      </div>
      <div class="tip-amount-row">
        <label for="tip-flat">Or flat tip $</label>
        <input type="number" id="tip-flat" min="0" step="0.01" placeholder="0.00">
      </div>
    </section>

    <!-- Equal Split Panel (f1) -->
    <section class="panel" id="panel-equal" role="tabpanel">
      <div class="card">
        <h2 class="section-title">Equal Split</h2>
        <div class="form-row">
          <label for="eq-total">Bill total ($)</label>
          <input type="number" id="eq-total" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="form-row">
          <label for="eq-diners">Number of diners</label>
          <input type="number" id="eq-diners" min="1" step="1" value="2">
        </div>
      </div>
    </section>

    <!-- Itemized Split Panel (f2) -->
    <section class="panel hidden" id="panel-itemized" role="tabpanel">
      <div class="card">
        <h2 class="section-title">Itemized Split</h2>
        <div class="form-row">
          <label for="iz-diners">Number of diners</label>
          <input type="number" id="iz-diners" min="1" max="20" step="1" value="2">
        </div>
        <div id="iz-diner-names" class="diner-names-grid"></div>
        <div id="iz-items"></div>
        <button class="btn-add" id="iz-add-item">+ Add item</button>
      </div>
    </section>

    <!-- Custom Amounts Panel (f3) -->
    <section class="panel hidden" id="panel-custom" role="tabpanel">
      <div class="card">
        <h2 class="section-title">Custom Amounts</h2>
        <div class="form-row">
          <label for="cu-total">Bill total ($)</label>
          <input type="number" id="cu-total" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="form-row">
          <label for="cu-diners">Number of diners</label>
          <input type="number" id="cu-diners" min="1" max="20" step="1" value="2">
        </div>
        <div id="cu-inputs"></div>
        <div class="balance-bar" id="cu-balance-bar">
          <span class="balance-label">Remaining</span>
          <span class="balance-value" id="cu-remaining">$0.00</span>
        </div>
      </div>
    </section>

    <!-- Per-Person Summary (f5) -->
    <section class="summary-section" id="summary">
      <h2 class="section-title">Per-Person Summary</h2>
      <div id="summary-cards" class="summary-grid"></div>
      <div class="grand-total-bar card" id="grand-total-bar">
        <span>Grand total</span>
        <span id="grand-total-value">$0.00</span>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
